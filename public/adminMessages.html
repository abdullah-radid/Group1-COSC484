<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Messages - Towson Apartments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div class="nav-brand">Towson Apartments</div>
        <div class="nav-right">
            <span class="nav-user">Administration Portal</span>
            <button class="nav-logout" onclick="window.location.href='Login.html'">Logout</button>
        </div>
    </nav>

    <div id="banner">
        <div id="banner-text">
            <h1>Resident Messages</h1>
            <p>View and respond to resident concerns</p>
        </div>
    </div>

    <div id="content">
        <button class="btn-back" onclick="window.location.href='administrationMenu.html'">&larr; Back to Dashboard</button>

        <div class="table-card">
            <div class="table-card-header">
                <h2>All Messages</h2>
                <span id="messageCount" style="font-size:13px; color:#aaa;">0 messages</span>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>From</th>
                        <th>Unit</th>
                        <th>Subject</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="messagesBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="messageModal">
        <div class="modal-card">
            <h2 id="modalSubject">Message</h2>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-body" id="modalBody"></div>
            <button class="btn-small" onclick="closeMessageModal()">Close</button>
        </div>
    </div>

    <script>
        let loadedMessages = [];

        function badgeClass(status) {
            return status === 'Read' ? 'badge-done' : 'badge-pending';
        }

        async function openMessage(id) {
            const message = loadedMessages.find(m => m._id === id);
            if (!message) return;

            document.getElementById('modalSubject').textContent = message.subject;
            document.getElementById('modalMeta').textContent = `Unit ${message.unit || 'N/A'} • ${message.category} • ${new Date(message.createdAt).toLocaleString()}`;
            document.getElementById('modalBody').textContent = message.body;
            document.getElementById('messageModal').classList.add('open');

            if (message.status !== 'Read') {
                await fetch('/api/messages/' + id, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'Read' })
                });
                message.status = 'Read';
                loadMessages();
            }
        }

        function closeMessageModal() {
            document.getElementById('messageModal').classList.remove('open');
        }

        async function loadMessages() {
            const tbody = document.getElementById('messagesBody');
            const res = await fetch('/api/messages');
            loadedMessages = await res.json();
            document.getElementById('messageCount').textContent = loadedMessages.length + ' messages';

            tbody.innerHTML = loadedMessages.map(m => `
                <tr>
                    <td>Resident</td>
                    <td>${m.unit || ''}</td>
                    <td><button class="message-link" onclick="openMessage('${m._id}')">${m.subject}</button></td>
                    <td>${m.category}</td>
                    <td>${new Date(m.createdAt).toLocaleDateString()}</td>
                    <td><span class="badge ${badgeClass(m.status)}">${m.status}</span></td>
                    <td><button class="btn-small" onclick="openMessage('${m._id}')">Open</button></td>
                </tr>
            `).join('') || '<tr><td colspan="7">No messages yet.</td></tr>';
        }
        loadMessages();
    </script>

    <script src="portal.js"></script>
</body>
</html>
