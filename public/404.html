<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Towson Apartments</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            text-align: center;
            padding: 40px 20px;
        }

        .not-found .code {
            font-size: 96px;
            font-weight: bold;
            color: #e0e0e0;
            line-height: 1;
            margin-bottom: 16px;
        }

        .not-found h1 {
            font-size: 26px;
            margin: 0 0 10px;
            color: #1a1a1a;
        }

        .not-found p {
            font-size: 15px;
            color: #888;
            margin: 0 0 30px;
        }

        body.dark .not-found h1 { color: #e0e0e0; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">Towson Apartments</div>
        <div class="nav-right">
            <button class="nav-logout" onclick="window.location.href='Login.html'">Login</button>
        </div>
    </nav>

    <div class="not-found">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <button class="btn-submit" onclick="window.location.href='index.html'">Go to Homepage</button>
    </div>

    <script src="portal.js"></script>
</body>
</html>
