<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riverside Apartments - Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("https://images.pexels.com/photos/33230969/pexels-photo-33230969.jpeg");
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.55);
            padding: 0 30px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 0;
            justify-content: space-between;
        }

        .nav-brand {
            color: white;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 0.3px;
        }

        .nav-roles {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-label {
            color: #ccc;
            font-size: 14px;
            margin-right: 6px;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        nav a:hover,
        nav a.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        #box {
            width: 440px;
            background: #FFE4C4;
            border: 2px solid rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 32px 30px 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        #box .box-brand {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #888;
            margin-bottom: 4px;
        }

        #box h2 {
            text-align: center;
            margin: 0 0 22px;
            font-size: 22px;
            color: #1a1a1a;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            display: block;
            margin-bottom: 5px;
        }

        input {
            padding: 10px 12px;
            font-size: 15px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            font-family: Arial, sans-serif;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #888;
        }

        button[type="submit"] {
            padding: 11px;
            font-size: 15px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            margin-top: 4px;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">Riverside Apartments</div>
        <div class="nav-roles">
            <span class="nav-label">Login as:</span>
            <a id="tab-resident" onclick="showResident()" class="active">Residents</a>
            <a id="tab-admin" onclick="showAdministration()">Administration</a>
            <a id="tab-maintenance" onclick="showMaintenance()">Maintenance</a>
        </div>
    </nav>

    <div id="box"></div>

    <script>
        function setActive(id) {
            ['tab-resident', 'tab-admin', 'tab-maintenance'].forEach(t =>
                document.getElementById(t).classList.remove('active')
            );
            document.getElementById(id).classList.add('active');
        }

        function showResident() {
            setActive('tab-resident');
            document.getElementById("box").innerHTML = `
                <div class="box-brand">Riverside Apartments</div>
                <h2>Resident Login</h2>
                <form action="residentMenu.html" method="get">
                    <div>
                        <label for="residentEmail">Email</label>
                        <input type="email" id="residentEmail" name="email" placeholder="Enter your email" required>
                    </div>
                    <div>
                        <label for="residentPassword">Password</label>
                        <input type="password" id="residentPassword" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            `;
        }

        function showMaintenance() {
            setActive('tab-maintenance');
            document.getElementById("box").innerHTML = `
                <div class="box-brand">Riverside Apartments</div>
                <h2>Maintenance Login</h2>
                <form action="maintenanceMenu.html" method="get">
                    <div>
                        <label for="maintenanceID">Employee ID</label>
                        <input type="number" id="maintenanceID" name="employeeID" placeholder="Enter employee ID" required>
                    </div>
                    <div>
                        <label for="maintenancePassword">Password</label>
                        <input type="password" id="maintenancePassword" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            `;
        }

        function showAdministration() {
            setActive('tab-admin');
            document.getElementById("box").innerHTML = `
                <div class="box-brand">Riverside Apartments</div>
                <h2>Administration Login</h2>
                <form action="administrationMenu.html" method="get">
                    <div>
                        <label for="adminID">Employee ID</label>
                        <input type="number" id="adminID" name="employeeID" placeholder="Enter employee ID" required>
                    </div>
                    <div>
                        <label for="adminPassword">Password</label>
                        <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required>
                    </div>
                    <div>
                        <label for="adminCode">Admin Code</label>
                        <input type="number" id="adminCode" name="adminCode" placeholder="Enter admin code" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            `;
        }

        showResident();
    </script>
</body>
</html>
