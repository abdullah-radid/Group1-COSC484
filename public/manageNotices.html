<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notices - Towson Apartments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div class="nav-brand">Towson Apartments</div>
        <div class="nav-right">
            <span class="nav-user">Administration Portal</span>
            <button class="nav-logout" onclick="window.location.href='Login.html'">Logout</button>
        </div>
    </nav>

    <div id="banner">
        <div id="banner-text">
            <h1>Manage Notices</h1>
            <p>Create and publish building announcements</p>
        </div>
    </div>

    <div id="content">
        <button class="btn-back" onclick="window.location.href='administrationMenu.html'">&larr; Back to Dashboard</button>

        <div style="display:flex; gap:26px; align-items:flex-start; flex-wrap:wrap;">

            <!-- Create Notice Form -->
            <div class="page-card" style="flex:1; min-width:300px; max-width:480px;">
                <h2 style="margin:0 0 20px; font-size:18px;">Post New Notice</h2>
                <form onsubmit="postNotice(event)" novalidate>

                    <div class="form-group">
                        <label for="noticeTitle">Title</label>
                        <input type="text" id="noticeTitle" placeholder="e.g. Scheduled Water Shutoff">
                        <span class="field-error">Title is required.</span>
                    </div>

                    <div class="form-group">
                        <label for="noticeDate">Post Date</label>
                        <input type="date" id="noticeDate">
                        <span class="field-error">Post date is required.</span>
                    </div>

                    <div class="form-group">
                        <label for="noticeBody">Message</label>
                        <textarea id="noticeBody" placeholder="Write the notice content here..."></textarea>
                        <span class="field-error">Message is required.</span>
                    </div>

                    <button type="submit" class="btn-submit">Post Notice</button>
                </form>
            </div>

            <!-- Existing Notices -->
            <div style="flex:1.4; min-width:300px;">
                <div class="table-card">
                    <div class="table-card-header">
                        <h2>Posted Notices</h2>
                        <span id="noticeCount" style="font-size:13px; color:#aaa;">0 active</span>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Posted</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="noticesBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        async function postNotice(e) {
            e.preventDefault();
            const fields = [
                { id: 'noticeTitle', msg: 'Title is required.' },
                { id: 'noticeDate',  msg: 'Post date is required.' },
                { id: 'noticeBody',  msg: 'Message is required.' }
            ];
            let valid = true;
            fields.forEach(f => {
                const el = document.getElementById(f.id);
                const group = el.closest('.form-group');
                if (!el.value.trim()) {
                    group.classList.add('has-error');
                    valid = false;
                } else {
                    group.classList.remove('has-error');
                }
                el.addEventListener('input', () => group.classList.remove('has-error'), { once: true });
            });
            if (!valid) return;
            try {
                const res = await fetch('/api/notices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: document.getElementById('noticeTitle').value.trim(),
                        postDate: document.getElementById('noticeDate').value,
                        body: document.getElementById('noticeBody').value.trim()
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Notice failed.');
                showToast('Notice posted successfully!', 'success');
                e.target.reset();
                loadNotices();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function loadNotices() {
            const tbody = document.getElementById('noticesBody');
            const res = await fetch('/api/notices');
            const notices = await res.json();
            document.getElementById('noticeCount').textContent = notices.length + ' active';
            tbody.innerHTML = notices.map(n => `
                <tr>
                    <td>${n.title}</td>
                    <td>${new Date(n.postDate).toLocaleDateString()}</td>
                    <td><span class="badge badge-progress">${n.status}</span></td>
                </tr>
            `).join('') || '<tr><td colspan="3">No notices posted yet.</td></tr>';
        }

        loadNotices();
    </script>

    <script src="portal.js"></script>
</body>
</html>
