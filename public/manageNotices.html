<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notices - Riverside Apartments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div class="nav-brand">Riverside Apartments</div>
        <div class="nav-right">
            <span class="nav-user">Administration Portal</span>
            <button class="nav-logout" onclick="window.location.href='Login.html'">Logout</button>
        </div>
    </nav>

    <div id="banner">
        <div id="banner-text">
            <h1>Manage Notices</h1>
            <p>Create and publish building announcements</p>
        </div>
    </div>

    <div id="content">
        <button class="btn-back" onclick="window.location.href='administrationMenu.html'">&larr; Back to Dashboard</button>

        <div style="display:flex; gap:26px; align-items:flex-start; flex-wrap:wrap;">

            <!-- Create Notice Form -->
            <div class="page-card" style="flex:1; min-width:300px; max-width:480px;">
                <h2 style="margin:0 0 20px; font-size:18px;">Post New Notice</h2>
                <form onsubmit="postNotice(event)">

                    <div class="form-group">
                        <label for="noticeTitle">Title</label>
                        <input type="text" id="noticeTitle" placeholder="e.g. Scheduled Water Shutoff" required>
                    </div>

                    <div class="form-group">
                        <label for="noticeDate">Post Date</label>
                        <input type="date" id="noticeDate" required>
                    </div>

                    <div class="form-group">
                        <label for="noticeBody">Message</label>
                        <textarea id="noticeBody" placeholder="Write the notice content here..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Post Notice</button>
                </form>
            </div>

            <!-- Existing Notices -->
            <div style="flex:1.4; min-width:300px;">
                <div class="table-card">
                    <div class="table-card-header">
                        <h2>Posted Notices</h2>
                        <span style="font-size:13px; color:#aaa;">2 active</span>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Posted</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Pool Closed for Maintenance</td>
                                <td>May 1, 2026</td>
                                <td><span class="badge badge-progress">Active</span></td>
                            </tr>
                            <tr>
                                <td>Parking Lot Resurfacing</td>
                                <td>Apr 28, 2026</td>
                                <td><span class="badge badge-progress">Active</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        function postNotice(e) {
            e.preventDefault();
            alert('Notice posted! (Backend integration coming soon)');
            e.target.reset();
        }
    </script>

</body>
</html>
